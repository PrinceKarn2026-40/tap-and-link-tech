<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Sticker — TAP&LINK.tech</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="../css/admin.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      .print-area, .print-area * { visibility: visible; }
      .print-area { position: fixed; top: 0; left: 0; }
      .no-print { display: none !important; }
    }

    .nfc-card {
      width: 85.6mm;
      height: 54mm;
      background: #111;
      border-radius: 6px;
      position: relative;
      overflow: hidden;
      font-family: 'Georgia', serif;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      flex-shrink: 0;
    }

    /* diagonal gold stripe */
    .stripe {
      position: absolute;
      top: 0; right: 0;
      width: 42%;
      height: 100%;
      z-index: 1;
    }
    .stripe::before {
      content: '';
      position: absolute;
      top: -10%; left: 10%;
      width: 3px;
      height: 130%;
      background: linear-gradient(180deg, #c9a84c, #f5d07a, #c9a84c);
      transform: rotate(15deg);
      transform-origin: top left;
      box-shadow: 0 0 12px rgba(201,168,76,0.6);
    }
    .stripe::after {
      content: '';
      position: absolute;
      top: 0; left: 15%;
      width: 85%;
      height: 100%;
      background-image: repeating-linear-gradient(
        60deg, transparent, transparent 5px,
        rgba(201,168,76,0.07) 5px, rgba(201,168,76,0.07) 6px
      );
    }

    /* left content */
    .card-left {
      position: absolute;
      left: 0; top: 0;
      width: 58%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4mm 3mm 4mm 4mm;
      z-index: 2;
    }

    .logo-circle {
      width: 13mm; height: 13mm;
      border: 1.5px solid #c9a84c;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 1.5mm;
    }
    .logo-initials {
      font-size: 4.5mm;
      font-weight: 900;
      color: #c9a84c;
    }
    .wifi-waves {
      position: absolute;
      top: -1mm; right: -2.5mm;
      font-size: 3mm;
      color: #c9a84c;
    }

    .brand-name {
      font-size: 5mm;
      font-weight: 800;
      color: #c9a84c;
      letter-spacing: 0.5px;
      text-align: center;
      line-height: 1;
      margin-bottom: 1mm;
    }

    .gold-line {
      width: 85%;
      height: 0.3mm;
      background: linear-gradient(90deg, transparent, #c9a84c, transparent);
      margin: 1mm 0;
      position: relative;
    }
    .gold-line::after {
      content: '✦';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #c9a84c;
      font-size: 2mm;
      background: #111;
      padding: 0 1mm;
    }

    .tagline {
      font-size: 1.8mm;
      color: rgba(201,168,76,0.65);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
    }

    .card-bottom-left {
      position: absolute;
      bottom: 2.5mm; left: 3mm;
      display: flex;
      align-items: center;
      gap: 1mm;
      z-index: 2;
    }
    .card-bottom-left i { font-size: 2mm; color: #c9a84c; }
    .card-bottom-left span { font-size: 1.8mm; color: rgba(201,168,76,0.6); }

    /* right content */
    .card-right {
      position: absolute;
      right: 2mm; top: 2mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5mm;
      z-index: 3;
    }
    .nfc-badge {
      width: 9mm; height: 9mm;
      border: 1.5px solid #c9a84c;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(201,168,76,0.05);
    }
    .nfc-badge i { font-size: 2.5mm; color: #c9a84c; }
    .nfc-badge b { font-size: 1.8mm; color: #c9a84c; font-weight: 900; }
    .tap-text { font-size: 1.3mm; color: rgba(201,168,76,0.55); text-align: center; line-height: 1.3; }

    /* QR code bottom right */
    .card-qr {
      position: absolute;
      bottom: 2mm; right: 2mm;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5mm;
    }
    .qr-border {
      border: 1px solid #c9a84c;
      padding: 1mm;
      border-radius: 2px;
      background: #111;
    }
    .qr-border img, .qr-border canvas {
      width: 12mm !important;
      height: 12mm !important;
      display: block;
      filter: invert(1) sepia(1) saturate(2) hue-rotate(5deg) brightness(0.85);
    }
    .scan-me {
      font-size: 1.3mm;
      color: rgba(201,168,76,0.6);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* customer name on card */
    .card-customer-name {
      position: absolute;
      bottom: 2.5mm;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.8mm;
      color: rgba(201,168,76,0.5);
      white-space: nowrap;
      z-index: 2;
    }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/layout.js"></script>
  <script>Auth.require(); AdminLayout.render('Card Sticker');</script>

  <script>
  const content = document.getElementById('pageContent');
  content.innerHTML = `
    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2 no-print">
      <div>
        <h5 class="fw-bold mb-0" style="color:#1a1a2e;">NFC Card Stickers</h5>
        <small class="text-muted">Select a customer and print their card sticker</small>
      </div>
      <div class="d-flex gap-2">
        <select class="form-select" id="customerSelect" style="max-width:220px;">
          <option value="">Select customer...</option>
        </select>
        <button class="btn btn-primary px-4" onclick="window.print()">
          <i class="bi bi-printer me-2"></i>Print
        </button>
      </div>
    </div>

    <div class="content-card no-print">
      <div class="content-card-body d-flex justify-content-center py-5">
        <div id="cardPreview"></div>
      </div>
    </div>

    <div class="print-area" id="printArea" style="display:none;"></div>
  `;

  async function loadCustomers() {
    const res = await API.get('/api/customers?limit=100');
    if (!res || !res.success) return;
    const select = document.getElementById('customerSelect');
    res.customers.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.slug;
      opt.textContent = c.full_name;
      select.appendChild(opt);
    });
    select.addEventListener('change', () => {
      const slug = select.value;
      if (!slug) return;
      renderCard(slug, 'cardPreview');
      const pa = document.getElementById('printArea');
      pa.innerHTML = '';
      pa.style.display = 'block';
      renderCard(slug, 'printArea');
    });
  }

  function renderCard(slug, containerId) {
    const url = `${window.location.origin}/card/${slug}`;
    const container = document.getElementById(containerId);
    const qrId = `qr-${containerId}`;

    container.innerHTML = `
      <div class="nfc-card">
        <div class="stripe"></div>

        <div class="card-left">
          <div class="logo-circle">
            <span class="logo-initials">TL</span>
            <i class="bi bi-wifi wifi-waves"></i>
          </div>
          <div class="brand-name">TAP&amp;LINK.tech</div>
          <div class="gold-line"></div>
          <div class="tagline">ONE TAP. ENDLESS CONNECTION</div>
        </div>

        <div class="card-right">
          <div class="nfc-badge">
            <i class="bi bi-wifi"></i>
            <b>NFC</b>
          </div>
          <div class="tap-text">TAP TO<br>CONNECT</div>
        </div>

        <div class="card-qr">
          <div class="qr-border">
            <div id="${qrId}"></div>
          </div>
          <div class="scan-me">SCAN ME</div>
        </div>

        <div class="card-bottom-left">
          <i class="bi bi-globe"></i>
          <span>tapandlink.tech</span>
        </div>
      </div>
    `;

    new QRCode(document.getElementById(qrId), {
      text: url,
      width: 45,
      height: 45,
      colorDark: '#c9a84c',
      colorLight: '#111111',
      correctLevel: QRCode.CorrectLevel.M,
    });
  }

  loadCustomers();
  </script>
</body>
</html>
