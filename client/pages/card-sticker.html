<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Sticker — TAP&LINK.tech</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="../css/admin.css" rel="stylesheet" />
  <style>
    /* ── Print styles ── */
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: fixed; top: 0; left: 0; width: 100%; }
    }

    /* ── Card sticker ── */
    .nfc-card {
      width: 85.6mm;
      height: 54mm;
      background: #111;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      font-family: 'Georgia', serif;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    /* Gold diagonal stripe */
    .nfc-card::before {
      content: '';
      position: absolute;
      top: -20%;
      right: -5%;
      width: 45%;
      height: 160%;
      background: linear-gradient(135deg, transparent 40%, rgba(201,168,76,0.15) 40%, rgba(201,168,76,0.08) 60%, transparent 60%);
      border-left: 2px solid #c9a84c;
      border-right: 1px solid rgba(201,168,76,0.4);
      transform: rotate(0deg);
      pointer-events: none;
    }

    /* Triangle pattern on right */
    .nfc-card::after {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 38%;
      height: 100%;
      background-image: repeating-linear-gradient(
        60deg,
        transparent,
        transparent 6px,
        rgba(201,168,76,0.08) 6px,
        rgba(201,168,76,0.08) 7px
      );
      pointer-events: none;
    }

    .card-left {
      position: absolute;
      left: 0; top: 0;
      width: 62%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6mm 4mm;
      z-index: 2;
    }

    .logo-circle {
      width: 14mm;
      height: 14mm;
      border: 1.5px solid #c9a84c;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2mm;
      position: relative;
    }

    .logo-initials {
      font-size: 5mm;
      font-weight: 900;
      color: #c9a84c;
      letter-spacing: -0.5px;
    }

    .wifi-icon {
      position: absolute;
      top: -1mm;
      right: -2mm;
      font-size: 3mm;
      color: #c9a84c;
    }

    .brand-name {
      font-size: 5.5mm;
      font-weight: 800;
      color: #c9a84c;
      letter-spacing: 1px;
      text-align: center;
      line-height: 1;
      margin-bottom: 1.5mm;
    }

    .gold-line {
      width: 80%;
      height: 0.3mm;
      background: linear-gradient(90deg, transparent, #c9a84c, transparent);
      margin: 1mm auto;
    }

    .tagline {
      font-size: 2mm;
      color: rgba(201,168,76,0.7);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
    }

    .card-bottom {
      position: absolute;
      bottom: 3mm;
      left: 4mm;
      display: flex;
      align-items: center;
      gap: 1.5mm;
      z-index: 2;
    }

    .card-bottom i {
      font-size: 2.5mm;
      color: #c9a84c;
    }

    .card-bottom span {
      font-size: 2mm;
      color: rgba(201,168,76,0.7);
    }

    .card-right {
      position: absolute;
      right: 3mm;
      top: 3mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1mm;
      z-index: 3;
    }

    .nfc-badge {
      width: 10mm;
      height: 10mm;
      border: 1.5px solid #c9a84c;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(201,168,76,0.05);
    }

    .nfc-badge i {
      font-size: 3mm;
      color: #c9a84c;
    }

    .nfc-badge span {
      font-size: 1.8mm;
      font-weight: 800;
      color: #c9a84c;
      letter-spacing: 0.5px;
    }

    .tap-text {
      font-size: 1.5mm;
      color: rgba(201,168,76,0.6);
      letter-spacing: 0.5px;
      text-align: center;
    }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/layout.js"></script>
  <script>Auth.require(); AdminLayout.render('Card Sticker');</script>

  <script>
  const content = document.getElementById('pageContent');
  content.innerHTML = `
    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
      <div>
        <h5 class="fw-bold mb-0" style="color:#1a1a2e;">NFC Card Sticker</h5>
        <small class="text-muted">Preview and print the card sticker design</small>
      </div>
      <button class="btn btn-primary px-4" onclick="window.print()">
        <i class="bi bi-printer me-2"></i>Print Sticker
      </button>
    </div>

    <div class="content-card">
      <div class="content-card-body d-flex flex-column align-items-center py-5" id="printArea">
        <div class="nfc-card">
          <div class="card-left">
            <div class="logo-circle">
              <span class="logo-initials">TL</span>
              <i class="bi bi-wifi wifi-icon"></i>
            </div>
            <div class="brand-name">TAP&amp;LINK.tech</div>
            <div class="gold-line"></div>
            <div class="tagline">ONE TAP. ENDLESS CONNECTION</div>
          </div>

          <div class="card-right">
            <div class="nfc-badge">
              <i class="bi bi-wifi"></i>
              <span>NFC</span>
            </div>
            <div class="tap-text">TAP TO<br>CONNECT</div>
          </div>

          <div class="card-bottom">
            <i class="bi bi-globe"></i>
            <span>tapandlink.tech</span>
          </div>
        </div>

        <p class="text-muted mt-4" style="font-size:0.8rem;">
          Standard credit card size: 85.6mm × 54mm
        </p>
      </div>
    </div>
  `;
  </script>
</body>
</html>
