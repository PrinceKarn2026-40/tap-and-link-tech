<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Sticker — TAP&LINK.tech</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="../css/admin.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: fixed; top: 0; left: 0; }
      .no-print { display: none !important; }
    }

    .nfc-card {
      width: 85.6mm;
      height: 54mm;
      background: #111;
      border-radius: 4mm;
      position: relative;
      overflow: hidden;
      font-family: 'Georgia', serif;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    }

    /* diagonal gold stripe */
    .stripe {
      position: absolute;
      top: -10%; right: 0;
      width: 42%;
      height: 130%;
      z-index: 1;
      border-left: 3px solid #c9a84c;
      transform: rotate(8deg) translateX(60px);
      box-shadow: -4px 0 20px rgba(201,168,76,0.5);
    }

    /* triangle pattern right side */
    .pattern {
      position: absolute;
      top: 0; right: 0;
      width: 40%;
      height: 100%;
      z-index: 0;
      background-image: repeating-linear-gradient(
        60deg, transparent, transparent 12px,
        rgba(201,168,76,0.06) 12px, rgba(201,168,76,0.06) 13px
      );
    }

    /* glow on stripe */
    .glow {
      position: absolute;
      top: 20%; right: 36%;
      width: 6px;
      height: 40%;
      background: linear-gradient(180deg, transparent, #f5d07a, transparent);
      filter: blur(6px);
      z-index: 2;
      transform: rotate(8deg);
    }

    /* left content */
    .card-left {
      position: absolute;
      left: 0; top: 0;
      width: 60%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 30px 40px 40px;
      z-index: 3;
    }

    .logo-img {
      width: 18mm;
      height: 18mm;
      object-fit: contain;
      margin-bottom: 2mm;
    }

    .brand-name {
      font-size: 6mm;
      font-weight: 800;
      color: #c9a84c;
      letter-spacing: 1px;
      text-align: center;
      line-height: 1;
      margin-bottom: 1mm;
    }

    .gold-line {
      width: 85%;
      height: 0.3mm;
      background: linear-gradient(90deg, transparent, #c9a84c, transparent);
      margin: 1mm 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gold-line::before, .gold-line::after {
      content: '';
      flex: 1;
      height: 0.3mm;
      background: linear-gradient(90deg, transparent, #c9a84c);
    }
    .gold-line::after {
      background: linear-gradient(90deg, #c9a84c, transparent);
    }
    .diamond {
      color: #c9a84c;
      font-size: 2mm;
      padding: 0 1mm;
    }

    .tagline {
      font-size: 2mm;
      color: rgba(201,168,76,0.65);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      margin-top: 0.5mm;
    }

    .card-bottom-left {
      position: absolute;
      bottom: 2.5mm; left: 3mm;
      display: flex;
      align-items: center;
      gap: 1mm;
      z-index: 3;
    }
    .card-bottom-left i { font-size: 2mm; color: #c9a84c; }
    .card-bottom-left span { font-size: 1.8mm; color: rgba(201,168,76,0.6); }

    /* NFC badge top right */
    .nfc-badge-wrap {
      position: absolute;
      top: 2.5mm; right: 2.5mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5mm;
      z-index: 4;
    }
    .nfc-badge {
      width: 10mm; height: 10mm;
      border: 1.5px solid #c9a84c;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(201,168,76,0.05);
    }
    .nfc-badge i { font-size: 3mm; color: #c9a84c; }
    .nfc-badge b { font-size: 2mm; color: #c9a84c; font-weight: 900; letter-spacing: 1px; }
    .tap-text { font-size: 1.3mm; color: rgba(201,168,76,0.55); letter-spacing: 0.5px; text-align: center; }

    /* QR code bottom right */
    .card-qr {
      position: absolute;
      bottom: 2mm; right: 2mm;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5mm;
    }
    .qr-border {
      border: 1.5px solid #c9a84c;
      padding: 1mm;
      border-radius: 1mm;
      background: #111;
    }
    .qr-border canvas, .qr-border img {
      display: block;
      width: 13mm !important;
      height: 13mm !important;
    }
    .scan-me {
      font-size: 1.3mm;
      color: rgba(201,168,76,0.6);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/layout.js"></script>
  <script>Auth.require(); AdminLayout.render('Card Sticker');</script>

  <script>
  const content = document.getElementById('pageContent');
  content.innerHTML = `
    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2 no-print">
      <div>
        <h5 class="fw-bold mb-0" style="color:#1a1a2e;">NFC Card Sticker</h5>
        <small class="text-muted">Print-ready card design</small>
      </div>
      <button class="btn btn-primary px-4" onclick="window.print()">
        <i class="bi bi-printer me-2"></i>Print
      </button>
    </div>

    <div class="content-card no-print">
      <div class="content-card-body d-flex justify-content-center align-items-center py-5">
        <div id="printArea">
          <div class="nfc-card">
            <div class="pattern"></div>
            <div class="stripe"></div>
            <div class="glow"></div>

            <div class="card-left">
              <img src="../images/logo.png" class="logo-img" alt="TAP&LINK logo" />
              <div class="brand-name">TAP&amp;LINK.tech</div>
              <div class="gold-line"><span class="diamond">✦</span></div>
              <div class="tagline">ONE TAP. ENDLESS CONNECTION</div>
            </div>

            <div class="nfc-badge-wrap">
              <div class="nfc-badge">
                <i class="bi bi-wifi"></i>
                <b>NFC</b>
              </div>
              <div class="tap-text">TAP TO CONNECT</div>
            </div>

            <div class="card-qr">
              <div class="qr-border">
                <div id="qrCode"></div>
              </div>
              <div class="scan-me">— SCAN ME —</div>
            </div>

            <div class="card-bottom-left">
              <i class="bi bi-globe"></i>
              <span>tapandlink.tech</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;

  new QRCode(document.getElementById('qrCode'), {
    text: 'https://tapandlink.tech',
    width: 110,
    height: 110,
    colorDark: '#c9a84c',
    colorLight: '#111111',
    correctLevel: QRCode.CorrectLevel.M,
  });
  </script>
</body>
</html>
