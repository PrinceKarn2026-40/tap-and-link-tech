<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Sheet — TAP&LINK.tech</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="../css/admin.css" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600;700&display=swap');

    @media print {
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: fixed; top: 0; left: 0; width: 100%; }
      .no-print { display: none !important; }
    }

    .sheet-bg {
      background: #0a0a0a;
      min-height: 100vh;
      padding: 40px 20px;
      font-family: 'Inter', sans-serif;
    }

    /* ── Sheet Header ── */
    .sheet-header {
      text-align: center;
      margin-bottom: 48px;
    }
    .sheet-logo {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      font-weight: 900;
      background: linear-gradient(135deg, #c9a84c, #f5d07a, #c9a84c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 2px;
    }
    .sheet-tagline {
      color: rgba(201,168,76,0.6);
      font-size: 0.85rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-top: 6px;
    }
    .gold-divider {
      width: 120px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c9a84c, transparent);
      margin: 16px auto;
    }
    .sheet-subtitle {
      color: rgba(255,255,255,0.35);
      font-size: 0.75rem;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* ── Section Label ── */
    .section-label {
      color: rgba(201,168,76,0.5);
      font-size: 0.65rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 20px;
    }

    /* ══════════════════════════════
       CARD BASE
    ══════════════════════════════ */
    .nfc-card {
      width: 85.6mm;
      height: 54mm;
      border-radius: 4mm;
      position: relative;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      box-shadow: 0 30px 80px rgba(0,0,0,0.9), 0 0 0 0.5px rgba(201,168,76,0.2);
      flex-shrink: 0;
    }

    /* ══════════════════════════════
       DESIGN 1 — CLASSIC BLACK GOLD
    ══════════════════════════════ */
    .card-d1 { background: #0d0d0d; }
    .card-d1 .stripe {
      position: absolute; top: -10%; right: 0;
      width: 42%; height: 130%; z-index: 1;
      border-left: 2px solid #c9a84c;
      transform: rotate(8deg) translateX(60px);
      box-shadow: -4px 0 20px rgba(201,168,76,0.4);
    }
    .card-d1 .pattern {
      position: absolute; top: 0; right: 0;
      width: 40%; height: 100%; z-index: 0;
      background-image: repeating-linear-gradient(60deg, transparent, transparent 12px, rgba(201,168,76,0.05) 12px, rgba(201,168,76,0.05) 13px);
    }
    .card-d1 .glow {
      position: absolute; top: 20%; right: 36%;
      width: 5px; height: 40%;
      background: linear-gradient(180deg, transparent, #f5d07a, transparent);
      filter: blur(5px); z-index: 2; transform: rotate(8deg);
    }
    .card-d1 .card-left {
      position: absolute; left: 0; top: 0;
      width: 58%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 6mm 4mm 6mm 6mm; z-index: 3;
    }
    .card-d1 .logo-img { width: 14mm; height: 14mm; object-fit: contain; margin-bottom: 1.5mm; }
    .card-d1 .brand { font-size: 5mm; font-weight: 800; color: #c9a84c; letter-spacing: 1px; text-align: center; line-height: 1; }
    .card-d1 .tagline-card { font-size: 1.6mm; color: rgba(201,168,76,0.55); letter-spacing: 2px; text-transform: uppercase; text-align: center; margin-top: 1mm; }
    .card-d1 .nfc-badge-wrap {
      position: absolute; top: 2.5mm; right: 2.5mm;
      display: flex; flex-direction: column; align-items: center; gap: 0.5mm; z-index: 4;
    }
    .card-d1 .nfc-badge {
      width: 9mm; height: 9mm;
      border: 1.5px solid #c9a84c; border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(201,168,76,0.05);
    }
    .card-d1 .nfc-badge i { font-size: 3mm; color: #c9a84c; }
    .card-d1 .tap-text { font-size: 1.2mm; color: rgba(201,168,76,0.5); letter-spacing: 0.5px; text-align: center; }
    .card-d1 .card-bottom { position: absolute; bottom: 2mm; left: 3mm; display: flex; align-items: center; gap: 1mm; z-index: 3; }
    .card-d1 .card-bottom i { font-size: 1.8mm; color: #c9a84c; }
    .card-d1 .card-bottom span { font-size: 1.6mm; color: rgba(201,168,76,0.55); }

    /* ══════════════════════════════
       DESIGN 1 BACK
    ══════════════════════════════ */
    .card-d1-back { background: #0d0d0d; }
    .card-d1-back .back-stripe {
      position: absolute; top: 0; left: 0; right: 0;
      height: 12mm; background: #111;
      border-bottom: 1px solid rgba(201,168,76,0.15);
    }
    .card-d1-back .back-content {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 14mm 6mm 4mm;
      z-index: 2;
    }
    .card-d1-back .person-name { font-size: 4mm; font-weight: 700; color: #f5d07a; letter-spacing: 0.5px; text-align: center; }
    .card-d1-back .person-title { font-size: 2mm; color: rgba(201,168,76,0.6); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 2mm; text-align: center; }
    .card-d1-back .contact-line { display: flex; align-items: center; gap: 1.5mm; margin-bottom: 1mm; }
    .card-d1-back .contact-line i { font-size: 2mm; color: #c9a84c; width: 3mm; text-align: center; }
    .card-d1-back .contact-line span { font-size: 1.8mm; color: rgba(255,255,255,0.65); }
    .card-d1-back .social-row { display: flex; gap: 2mm; margin-top: 2mm; }
    .card-d1-back .social-row i { font-size: 2.5mm; color: rgba(201,168,76,0.6); }
    .card-d1-back .gold-line-back {
      width: 70%; height: 0.3mm;
      background: linear-gradient(90deg, transparent, #c9a84c, transparent);
      margin: 1.5mm auto;
    }

    /* ══════════════════════════════
       DESIGN 2 — DARK NAVY GOLD
    ══════════════════════════════ */
    .card-d2 { background: linear-gradient(135deg, #0a0e1a 0%, #111827 100%); }
    .card-d2 .corner-accent {
      position: absolute; top: 0; left: 0;
      width: 0; height: 0;
      border-style: solid;
      border-width: 20mm 20mm 0 0;
      border-color: rgba(201,168,76,0.12) transparent transparent transparent;
    }
    .card-d2 .corner-accent-br {
      position: absolute; bottom: 0; right: 0;
      width: 0; height: 0;
      border-style: solid;
      border-width: 0 0 16mm 16mm;
      border-color: transparent transparent rgba(201,168,76,0.08) transparent;
    }
    .card-d2 .d2-content {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      justify-content: center; padding: 5mm 6mm;
      z-index: 2;
    }
    .card-d2 .d2-brand { font-size: 5.5mm; font-weight: 900; color: #c9a84c; font-family: 'Playfair Display', serif; letter-spacing: 1px; }
    .card-d2 .d2-tagline { font-size: 1.6mm; color: rgba(201,168,76,0.5); letter-spacing: 2.5px; text-transform: uppercase; margin-bottom: 3mm; }
    .card-d2 .d2-divider { width: 50%; height: 0.3mm; background: linear-gradient(90deg, #c9a84c, transparent); margin-bottom: 3mm; }
    .card-d2 .d2-name { font-size: 3.5mm; font-weight: 600; color: white; }
    .card-d2 .d2-title { font-size: 1.8mm; color: rgba(255,255,255,0.45); letter-spacing: 1px; text-transform: uppercase; }
    .card-d2 .d2-nfc {
      position: absolute; bottom: 3mm; right: 3mm;
      display: flex; align-items: center; gap: 1.5mm; z-index: 3;
    }
    .card-d2 .d2-nfc i { font-size: 4mm; color: rgba(201,168,76,0.7); }
    .card-d2 .d2-nfc span { font-size: 1.5mm; color: rgba(201,168,76,0.5); letter-spacing: 1px; text-transform: uppercase; }
    .card-d2 .d2-dots {
      position: absolute; right: 5mm; top: 50%;
      transform: translateY(-50%);
      display: grid; grid-template-columns: repeat(4,1fr); gap: 1.5mm; z-index: 1;
    }
    .card-d2 .d2-dots span {
      width: 1.5mm; height: 1.5mm; border-radius: 50%;
      background: rgba(201,168,76,0.15);
      display: block;
    }

    /* ══════════════════════════════
       DESIGN 3 — MATTE CHARCOAL
    ══════════════════════════════ */
    .card-d3 { background: #1a1a1a; }
    .card-d3 .d3-top-bar {
      position: absolute; top: 0; left: 0; right: 0;
      height: 1.5mm;
      background: linear-gradient(90deg, #c9a84c, #f5d07a, #c9a84c);
    }
    .card-d3 .d3-bottom-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 0.5mm;
      background: linear-gradient(90deg, transparent, #c9a84c, transparent);
    }
    .card-d3 .d3-content {
      position: absolute; inset: 0;
      display: flex; align-items: center;
      padding: 5mm 6mm; gap: 4mm; z-index: 2;
    }
    .card-d3 .d3-left { display: flex; flex-direction: column; align-items: center; gap: 2mm; flex-shrink: 0; }
    .card-d3 .d3-logo { width: 12mm; height: 12mm; object-fit: contain; }
    .card-d3 .d3-nfc-icon { font-size: 4mm; color: rgba(201,168,76,0.6); }
    .card-d3 .d3-vline { width: 0.3mm; height: 30mm; background: linear-gradient(180deg, transparent, #c9a84c, transparent); flex-shrink: 0; }
    .card-d3 .d3-right { flex: 1; }
    .card-d3 .d3-brand { font-size: 4.5mm; font-weight: 800; color: #c9a84c; letter-spacing: 1px; }
    .card-d3 .d3-tagline { font-size: 1.5mm; color: rgba(201,168,76,0.45); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 2.5mm; }
    .card-d3 .d3-name { font-size: 3mm; font-weight: 600; color: white; }
    .card-d3 .d3-title { font-size: 1.8mm; color: rgba(255,255,255,0.4); letter-spacing: 0.5px; margin-bottom: 1.5mm; }
    .card-d3 .d3-contact { font-size: 1.6mm; color: rgba(255,255,255,0.5); }

    /* ══════════════════════════════
       QR CARD (standalone)
    ══════════════════════════════ */
    .card-qr-only { background: #0d0d0d; }
    .card-qr-only .qr-content {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 5mm 6mm; z-index: 2;
    }
    .card-qr-only .qr-left { display: flex; flex-direction: column; justify-content: center; gap: 1.5mm; }
    .card-qr-only .qr-brand { font-size: 4.5mm; font-weight: 900; color: #c9a84c; font-family: 'Playfair Display', serif; }
    .card-qr-only .qr-tagline { font-size: 1.5mm; color: rgba(201,168,76,0.5); letter-spacing: 2px; text-transform: uppercase; }
    .card-qr-only .qr-divider { width: 40mm; height: 0.3mm; background: linear-gradient(90deg, #c9a84c, transparent); }
    .card-qr-only .qr-name { font-size: 3mm; font-weight: 600; color: white; margin-top: 1mm; }
    .card-qr-only .qr-title { font-size: 1.8mm; color: rgba(255,255,255,0.4); }
    .card-qr-only .qr-box {
      border: 1.5px solid rgba(201,168,76,0.5);
      padding: 2mm; border-radius: 1.5mm;
      background: white; flex-shrink: 0;
    }
    .card-qr-only .qr-box img { width: 16mm; height: 16mm; display: block; }
    .card-qr-only .qr-scan { font-size: 1.2mm; color: rgba(201,168,76,0.5); letter-spacing: 1.5px; text-transform: uppercase; text-align: center; margin-top: 1mm; }
    .card-qr-only .corner-tl, .card-qr-only .corner-br {
      position: absolute; width: 5mm; height: 5mm; z-index: 3;
    }
    .card-qr-only .corner-tl { top: 2mm; left: 2mm; border-top: 1.5px solid #c9a84c; border-left: 1.5px solid #c9a84c; }
    .card-qr-only .corner-br { bottom: 2mm; right: 2mm; border-bottom: 1.5px solid #c9a84c; border-right: 1.5px solid #c9a84c; }

    /* ── Card wrapper / label ── */
    .card-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .card-label { font-size: 0.65rem; color: rgba(201,168,76,0.4); letter-spacing: 2px; text-transform: uppercase; }

    /* ── Row layouts ── */
    .cards-row { display: flex; justify-content: center; align-items: flex-start; gap: 32px; flex-wrap: wrap; margin-bottom: 48px; }

    /* ── Sheet footer ── */
    .sheet-footer { text-align: center; margin-top: 16px; }
    .sheet-footer .footer-tagline {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      background: linear-gradient(135deg, #c9a84c, #f5d07a, #c9a84c);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      letter-spacing: 2px;
    }
    .sheet-footer .footer-sub { font-size: 0.7rem; color: rgba(255,255,255,0.2); letter-spacing: 3px; text-transform: uppercase; margin-top: 6px; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/layout.js"></script>

</body>
