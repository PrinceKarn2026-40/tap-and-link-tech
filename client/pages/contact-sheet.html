<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worker Contract — TAP&LINK.tech</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="../css/admin.css" rel="stylesheet" />
  <style>
    @media print {
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      .no-print { display: none !important; }
      .contract-paper { box-shadow: none !important; margin: 0 !important; }
      body { background: white !important; }
      .main-content { margin-left: 0 !important; }
    }

    .contract-paper {
      background: #fff;
      max-width: 820px;
      margin: 0 auto;
      padding: 48px 56px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.10);
      border-radius: 10px;
      font-family: 'Segoe UI', sans-serif;
      color: #1a1a2e;
    }

    .contract-header {
      text-align: center;
      border-bottom: 2px solid #1a1a2e;
      padding-bottom: 20px;
      margin-bottom: 28px;
    }
    .contract-header img { height: 52px; object-fit: contain; margin-bottom: 8px; }
    .contract-header h2 { font-size: 1.4rem; font-weight: 800; letter-spacing: 1px; margin: 0; color: #1a1a2e; }
    .contract-header p { font-size: 0.8rem; color: #6c757d; margin: 4px 0 0; letter-spacing: 1px; text-transform: uppercase; }

    .contract-title {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #1a1a2e;
      margin-bottom: 28px;
      position: relative;
    }
    .contract-title::after {
      content: '';
      display: block;
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, #dc2743, #bc1888);
      margin: 8px auto 0;
      border-radius: 2px;
    }

    /* Worker info fields */
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 32px; margin-bottom: 28px; }
    .info-field label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #6c757d; display: block; margin-bottom: 4px; }
    .info-field .field-line { border: none; border-bottom: 1.5px solid #1a1a2e; width: 100%; padding: 4px 0; font-size: 0.9rem; outline: none; background: transparent; }

    /* Rules section */
    .rules-section { margin-bottom: 28px; }
    .rules-section h6 { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: #1a1a2e; margin-bottom: 14px; padding-bottom: 6px; border-bottom: 1px solid #e9ecef; }
    .rule-item { display: flex; gap: 12px; margin-bottom: 10px; align-items: flex-start; }
    .rule-num { width: 22px; height: 22px; border-radius: 50%; background: #1a1a2e; color: white; font-size: 0.65rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
    .rule-text { font-size: 0.85rem; color: #333; line-height: 1.55; }

    /* Acknowledgement */
    .ack-box {
      background: #f8f9ff;
      border: 1px solid #e0e4f0;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 28px;
      font-size: 0.82rem;
      color: #444;
      line-height: 1.6;
    }

    /* Signature area */
    .sign-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-top: 8px; }
    .sign-block label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #6c757d; display: block; margin-bottom: 32px; }
    .sign-line { border-top: 1.5px solid #1a1a2e; padding-top: 6px; font-size: 0.72rem; color: #6c757d; }

    .contract-footer { text-align: center; margin-top: 32px; padding-top: 16px; border-top: 1px solid #e9ecef; font-size: 0.7rem; color: #adb5bd; letter-spacing: 1px; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/layout.js"></script>
  <script>Auth.require(); AdminLayout.render('Worker Contract');</script>

  <script>
  const content = document.getElementById('pageContent');
  content.innerHTML = `
    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2 no-print">
      <div>
        <h5 class="fw-bold mb-0" style="color:#1a1a2e;">Worker Contract</h5>
        <small class="text-muted">New employee rules &amp; sign-off sheet</small>
      </div>
      <button class="btn btn-primary px-4" onclick="window.print()">
        <i class="bi bi-printer me-2"></i>Print
      </button>
    </div>

    <div class="contract-paper">

      <!-- Header -->
      <div class="contract-header">
        <img src="../images/logo.png" alt="TAP&LINK logo" />
        <h2>TAP&amp;LINK.tech</h2>
        <p>NFC Digital Business Card Services &nbsp;·&nbsp; tap&amp;link.tech</p>
      </div>

      <!-- Title -->
      <div class="contract-title">New Worker Agreement &amp; Rules</div>

      <!-- Worker Info -->
      <div class="info-grid">
        <div class="info-field">
          <label>Full Name</label>
          <input class="field-line" type="text" placeholder=" " />
        </div>
        <div class="info-field">
          <label>Position / Role</label>
          <input class="field-line" type="text" placeholder=" " />
        </div>
        <div class="info-field">
          <label>Start Date</label>
          <input class="field-line" type="text" placeholder=" " />
        </div>
        <div class="info-field">
          <label>Phone Number</label>
          <input class="field-line" type="text" placeholder=" " />
        </div>
        <div class="info-field">
          <label>Email Address</label>
          <input class="field-line" type="text" placeholder=" " />
        </div>
        <div class="info-field">
          <label>Emergency Contact</label>
          <input class="field-line" type="text" placeholder=" " />
        </div>
      </div>

      <!-- Rules -->
      <div class="rules-section">
        <h6>Company Rules &amp; Policies</h6>

        <div class="rule-item">
          <div class="rule-num">1</div>
          <div class="rule-text"><strong>Punctuality:</strong> All workers must arrive on time. Repeated lateness without prior notice will result in disciplinary action.</div>
        </div>
        <div class="rule-item">
          <div class="rule-num">2</div>
          <div class="rule-text"><strong>Confidentiality:</strong> All customer data, business information, and internal systems must be kept strictly confidential. Sharing any data with third parties is strictly prohibited.</div>

        </div>
        <div class="rule-item">
          <div class="rule-num">5</div>
          <div class="rule-text"><strong>NFC Card Handling:</strong> Physical NFC cards and materials must be handled with care. Any loss or damage must be reported immediately to management.</div>
        </div>
        <div class="rule-item">
          <div class="rule-num">6</div>

        </div>
        <div class="rule-item">
          <div class="rule-num">7</div>
          <div class="rule-text"><strong>Dress Code:</strong> A clean, professional appearance is required during all customer-facing activities and business meetings.</div>
        </div>
        <div class="rule-item">
          <div class="rule-num">8</div>
          <div class="rule-text"><strong>Resignation Notice:</strong> A minimum of 2 weeks written notice is required before leaving the company.</div>
        </div>
      </div>

      <!-- Acknowledgement -->
      <div class="ack-box">
        <strong>Acknowledgement:</strong> By signing below, I confirm that I have read, understood, and agree to comply with all the rules and policies outlined in this document. I understand that failure to follow these rules may result in disciplinary action, up to and including termination of employment.
      </div>

      <!-- Signatures -->
      <div class="sign-grid">
        <div class="sign-block">
          <label>Worker Signature</label>
          <div class="sign-line">Signature &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Date</div>
        </div>
        <div class="sign-block">
          <label>Manager / Authorized Signature</label>
          <div class="sign-line">Signature &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Date</div>
        </div>
      </div>

      <!-- Footer -->
      <div class="contract-footer">
        TAP&amp;LINK.tech &nbsp;·&nbsp; Confidential Document &nbsp;·&nbsp; Keep a copy for your records
      </div>

    </div>
  `;
  </script>
</body>
</html>
